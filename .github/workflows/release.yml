name: Build unofficial arm64 release

# Manual runs, or push a tag like v1 / v1.0 to publish a release.
on:
  workflow_dispatch:
    inputs:
      core_set:
        description: "Which cores to build"
        type: choice
        default: essential
        options: [essential, all]
      publish:
        description: "Publish a GitHub Release (otherwise just upload an artifact)"
        type: boolean
        default: false
  push:
    tags: ["v*"]

permissions:
  contents: write        # needed to create releases

jobs:
  build:
    # macos-15 runners are Apple Silicon — required, this build is arm64-only.
    runs-on: macos-15
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          uname -m
          xcodebuild -version

      - name: Cache upstream checkouts
        uses: actions/cache@v4
        with:
          path: |
            build/OpenEmu
            build/PPSSPP-Core
          key: sources-${{ inputs.core_set || 'essential' }}-v1

      - name: Build
        env:
          CORE_SET: ${{ inputs.core_set || 'essential' }}
        run: |
          chmod +x scripts/*.sh
          ./scripts/bootstrap.sh "$GITHUB_WORKSPACE/build" "$CORE_SET"

      - name: Package
        id: pkg
        run: |
          cd build/dist
          NAME="$(ls -1 | head -1)"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          # ditto -k preserves bundle metadata and signatures; zip does not.
          ditto -c -k --sequesterRsrc --keepParent "$NAME" "$NAME.zip"
          shasum -a 256 "$NAME.zip" | tee "$NAME.zip.sha256"
          ls -lh

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.name }}
          path: |
            build/dist/*.zip
            build/dist/*.sha256
          retention-days: 14

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.pkg.outputs.name }}
          files: |
            build/dist/*.zip
            build/dist/*.sha256
          body: |
            **UNOFFICIAL community build of OpenEmu for Apple Silicon (arm64).**

            This is not an official OpenEmu release and is not produced or
            endorsed by the OpenEmu project. Please do not report issues from
            this build to them.

            OpenEmu and every emulator core here are the work of their
            respective authors — see `ATTRIBUTION.md`.

            **Installing:** read `INSTALL.txt` inside the archive. The build is
            ad-hoc signed, so you must run
            `xattr -dr com.apple.quarantine /Applications/OpenEmu.app` once.

            **Source:** several cores are GPL-licensed. The upstream sources
            are linked in `ATTRIBUTION.md`, and every modification made for
            this build is published as patch files in this repository.

            No ROMs or BIOS files are included.
